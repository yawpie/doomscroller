name: Android Auto Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANNEL="pr.${PR_NUMBER}"
          else
            CHANNEL="main"
          fi

          VERSION="v1.0.0-${CHANNEL}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests and lint
        run: |
          bash ./gradlew \
            :gesture:test \
            :app:testDebugUnitTest \
            :app:lintDebug

      - name: Build APK
        run: bash ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=(
            "$RELEASE_TAG"
            app/build/outputs/apk/release/*.apk
            --target "$GITHUB_SHA"
            --generate-notes
            --title "$RELEASE_TAG"
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
